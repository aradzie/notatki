[project]
name = "notatki"
version = "0.0.0"
description = "Notatki text notes importer addon for Anki"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "markdownify>=1.2.3",
  "mistune>=3.3.4",
]

[dependency-groups]
dev = [
  "aqt>=26.8.1",
  "mypy>=2.3.1",
  "pytest>=9.1.1",
  "ruff>=0.16.5",
]

[tool.ruff]
line-length = 120
indent-width = 2
